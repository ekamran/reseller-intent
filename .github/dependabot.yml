# Monthly, grouped: one pull request for the actions, one for the npm dev
# tools. Enough to stop versions going stale, not enough to be noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ['*']
    ignore:
      # The widget test runs the Reseller Store widget on the React that
      # WordPress core ships through wp-element: 18.x on 6.2, 7.1 and trunk.
      # React 19 also drops the UMD builds the test loads. Follow core.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
