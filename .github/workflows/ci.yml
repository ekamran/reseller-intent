name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A branch that gets three pushes in a row does not need three full runs of
# everything; only the newest one can still tell you anything useful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Plugin Check posts its findings as a PR comment.
  pull-requests: write

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every version between the declared floor and the newest release.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l
      - name: Unit harness (no WordPress, no database)
        run: php tests/unit/harness.php

  standards:
    name: Coding standards and PHP 7.4 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      # Pinned, so a green tick here means the same thing it means on a
      # maintainer's machine. Both pins are floors set by security advisories,
      # because Composer now refuses to install an affected release at all and
      # the job dies at install rather than at phpcs:
      #   wpcs  3.4.1  - below it, arbitrary code execution (PKSA-mh9b-91zm-m1gy)
      #   phpcs 3.13.6 - below it, OS command injection (PKSA-rdkp-vv9z-mjkg)
      # Raise a pin when the next advisory lands; do not switch the advisory
      # check off, it is the only thing that reported either of these.
      # Installed into its own directory: composer global on the runner
      # already carries tools of its own and cannot resolve these alongside
      # them.
      - name: Install PHPCS, WPCS and PHPCompatibilityWP
        run: |
          mkdir -p "$RUNNER_TEMP/cs"
          cd "$RUNNER_TEMP/cs"
          composer init --no-interaction --name=reseller-intent/cs
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --no-interaction --no-progress \
            squizlabs/php_codesniffer:3.13.6 \
            wp-coding-standards/wpcs:3.4.1 \
            phpcompatibility/phpcompatibility-wp:^2.1
      - name: WordPress coding standards
        run: |
          "$RUNNER_TEMP/cs/vendor/bin/phpcs" --standard=phpcs.xml.dist
      - name: PHP 7.4 floor compatibility (PHPCompatibilityWP)
        run: |
          "$RUNNER_TEMP/cs/vendor/bin/phpcs" --standard=phpcompat.xml.dist

  phpstan:
    name: Static analysis (PHPStan level 5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      # Same pattern as the standards job: its own directory, so it never
      # fights the runner's global Composer tools. phpstan.neon.dist finds
      # the WP-CLI stubs relative to wherever PHPStan is installed.
      - name: Install PHPStan with the WordPress and WP-CLI stubs
        run: |
          mkdir -p "$RUNNER_TEMP/stan"
          cd "$RUNNER_TEMP/stan"
          composer init --no-interaction --name=reseller-intent/stan
          composer config allow-plugins.phpstan/extension-installer true
          composer require --no-interaction --no-progress \
            phpstan/phpstan:^2.3 \
            phpstan/extension-installer:^1.4 \
            szepeviktor/phpstan-wordpress:^2.0 \
            php-stubs/wp-cli-stubs:^2.12
      - name: PHPStan
        run: |
          "$RUNNER_TEMP/stan/vendor/bin/phpstan" analyse -c phpstan.neon.dist --no-progress --memory-limit=1G

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Parse every script
        run: |
          for file in assets/js/*.js tests/widget/*.js; do
            echo "checking $file"
            node --check "$file"
          done

  minified:
    name: Minified files are fresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install terser and lightningcss
        run: npm ci
      - name: Rebuild the .min siblings and compare with the committed copies
        run: bash tests/build/check-minified.sh

  build:
    name: Release zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The zip is linted on the floor version, where a PHP 8 construct
          # would be a fatal for a real user.
          php-version: '7.4'
          coverage: none
      - name: Build the zip the way wordpress.org serves it and check it
        run: bash tests/build/check-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: reseller-intent-zip
          path: build/reseller-intent.zip
          if-no-files-found: error

  plugin-check:
    name: WordPress Plugin Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: reseller-intent-zip
          path: build
      # Against the release zip, not the checkout: Plugin Check rejects
      # hidden files and dev directories that the shipped zip never contains.
      - name: Unpack the release zip
        run: |
          unzip -q build/reseller-intent.zip -d build/unzipped
          ls build/unzipped/reseller-intent
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/unzipped/reseller-intent'

  playground:
    name: Playground (SQLite) on WordPress ${{ matrix.wp }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # latest is what the wordpress.org Live Preview runs. The CLI resolves
        # nightly, beta and trunk to latest as well, so one entry is honest.
        wp: ['latest']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the blueprint (demo seeder plus the verify script)
        # The PHP and WordPress versions live in the blueprint; the CLI's --php
        # and --wp flags are ignored by run-blueprint.
        run: PG_PHP=8.5 PG_WP=${{ matrix.wp }} php tests/playground/pg-build.php
      - name: Run the plugin on Playground
        run: |
          mkdir -p tests/playground/out
          npx --yes @wp-playground/cli@latest run-blueprint \
            --blueprint=tests/playground/pg-blueprint.json \
            --define-bool WP_DEBUG true \
            --mount="$PWD:/wordpress/wp-content/plugins/reseller-intent" \
            --mount="$PWD/tests/playground/out:/wordpress/pg-out" \
            --verbosity=quiet
      - name: Results
        run: |
          cat tests/playground/out/result.txt
          # Not "! grep": bash -e ignores a negated command, so a FAIL would stay green.
          if grep -q 'CHECK FAIL' tests/playground/out/result.txt; then echo 'a Playground check failed'; exit 1; fi
          test "$(grep -c 'CHECK ok' tests/playground/out/result.txt)" -ge 50
          echo; echo "== CLI inside Playground"; cat tests/playground/out/cli.txt

  wordpress:
    name: WordPress ${{ matrix.name }} (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor, on the newest PHP it supports.
          - name: '6.2 floor, PHP 8.0'
            core: 'WordPress/WordPress#6.2'
            php: '8.0'
          - name: 'latest, PHP 8.4'
            core: ''
            php: '8.4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pin the WordPress and PHP versions for this run
        run: |
          if [ -n "${{ matrix.core }}" ]; then
            printf '{ "core": "%s", "phpVersion": "%s" }\n' "${{ matrix.core }}" "${{ matrix.php }}" > .wp-env.override.json
          else
            printf '{ "phpVersion": "%s" }\n' "${{ matrix.php }}" > .wp-env.override.json
          fi
          cat .wp-env.override.json
      - name: Start WordPress with Reseller Store and the plugin
        run: npx --yes @wordpress/env@latest start
      - name: Checks
        run: bash tests/wp/run-checks.sh
      - name: Container logs
        if: failure()
        run: npx --yes @wordpress/env@latest logs || true

  widget:
    name: Reseller Store widget, both versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install puppeteer, React 18
        run: npm ci
      - name: Chrome for puppeteer
        run: npx puppeteer browsers install chrome
      - name: Continue to cart against the real 3.0.1 and 3.0.2 widget builds
        run: node tests/widget/continue-click-check.js
      - name: The same run with the minified tracker, which is what visitors load
        run: TRACKER_JS="$PWD/assets/js/tracker.min.js" node tests/widget/continue-click-check.js
